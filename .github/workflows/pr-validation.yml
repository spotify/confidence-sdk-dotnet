name: PR Validation

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: | 
          8.0.x
          9.0.x
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build with warnings as errors
      run: dotnet build --verbosity normal --no-restore /p:TreatWarningsAsErrors=true
    
    - name: Run tests on .NET 9.0
      run: dotnet test --no-build --verbosity normal --framework net9.0
    
    - name: Run tests on .NET 8.0
      run: dotnet test --no-build --verbosity normal --framework net8.0